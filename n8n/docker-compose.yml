# n8n do assistente de vendas no Telegram + túnel da Cloudflare.
# Não suba direto com "docker compose up": use iniciar_n8n.ps1, que descobre o
# endereço público do túnel e o passa ao n8n em WEBHOOK_URL (o Telegram só
# entrega mensagens em HTTPS público, e o endereço do túnel muda a cada início).
name: n8n

services:
  n8n:
    # Mesma imagem com que o banco foi criado: o n8n não volta a uma versão
    # anterior depois de migrar o banco. É uma versão "nightly" (prévia).
    image: n8nio/n8n:v3-rc-20260928
    container_name: n8n_celo
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      # Dados do n8n (workflows, credenciais, tabelas) fora do container:
      # recriar ou atualizar o container não apaga nada.
      - n8n_data:/home/node/.n8n

  tunel:
    image: cloudflare/cloudflared:latest
    container_name: n8n_tunel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://n8n:5678

volumes:
  n8n_data:
    external: true
